name: "Deliver Client to npm registry"

on:
  push:
    branches:
      - main
      - "release/**"
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Existing SDK release tag to publish (e.g. sdk-v0.22.0)"
        required: true
        type: string

# Default empty permissions for all jobs
permissions: {}

jobs:
  deliver:
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: opentdf/web-sdk/.github/workflows/reusable_deliver.yaml@main
    with:
      release-tag: ${{ inputs.release-tag || '' }}
