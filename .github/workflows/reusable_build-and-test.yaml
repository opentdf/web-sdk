name: "Reusable worflow: Build and Test Client"

env:
  # Skips SonarScan on PRs from forks, for security reasons.
  # Also false on merge_group, where there is no pull_request in the payload.
  # That is deliberate: the queue's post-merge push to main scans the same tree,
  # so nothing is lost by not scanning the queue entry as well.
  do_sonarscan: >-
    ${{ (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]' }}

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  ccc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lib
    timeout-minutes: 5
    steps:
      - name: Conventional Commits Check
        if: contains(fromJSON('["pull_request", "pull_request_target"]'), github.event_name)
        id: conventional-commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Types include:
          #   - fix: fixes
          #   - feat: features and enhancements
          #   - chore: non-feature or enhancement (i.e. docs, ci, linting, automated, etc)
          types: |
            fix
            feat
            chore
            revert
          # Scopes include:
          #   - sdk: changes to @opentdf/sdk (was lib)
          #   - cli: changes to @opentdf/ctl
          #   - ci: anything related to ci
          #   - tests: test only changes
          #   - docs: anything related solely to documentation
          #   - main: release-please release PRs
          scopes: |
            ci
            cli
            docs
            main
            sdk
            tests

  lib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lib
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './lib/package-lock.json'
      - run: npm ci
      - run: npm test
      - uses: fingerprintjs/action-coverage-report-md@72dfb7de7581612640a8e599e918b2eda98f9bba #v2.0.1
        id: coverage-md
        with:
          srcBasePath: './'
          textReportPath: './lib/coverage/coverage.txt'
      - run: echo "${MARKDOWN_REPORT}" >>$GITHUB_STEP_SUMMARY
        env:
          MARKDOWN_REPORT: '${{ steps.coverage-md.outputs.markdownReport }}'
      - run: npm audit --omit dev && npm audit --audit-level high --omit dev
      - run: npm run license-check
      - run: npm run lint
      - run: npm pack
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: opentdf-sdk-lib
          path: ./lib/opentdf-sdk-*.tgz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-lib
          path: ./lib/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  cli:
    needs:
      - lib
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './cli/package-lock.json'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-sdk-lib
          path: lib/
      - run: npm uninstall @opentdf/sdk && npm ci && npm i ../lib/opentdf-sdk-*.tgz
      - run: npm test
      - run: npm audit --omit dev && npm audit --audit-level high --omit dev
      - run: npm run license-check
      - run: npm run lint
      - run: npm pack
      - name: Setup Bats and bats libs
        uses: bats-core/bats-action@3.0.1
      - run: bats bin/opentdf.bats
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: opentdf-ctl
          path: ./cli/opentdf-ctl-*.tgz
          retention-days: 14

  web-app:
    needs:
      - lib
    runs-on: ubuntu-22.04 # NOTE: Playwright not yet supported on 24.04
    defaults:
      run:
        working-directory: ./web-app
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './web-app/package-lock.json'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-sdk-lib
          path: lib/
      - run: npm uninstall @opentdf/sdk && npm ci && npm i ../lib/opentdf-sdk-*.tgz
      - run: npm install
      - run: npm audit --omit dev && npm audit --audit-level high --omit dev
      - run: npm run license-check
      - run: npm run lint
      - run: npx playwright install
      - run: npm test
      - uses: fingerprintjs/action-coverage-report-md@72dfb7de7581612640a8e599e918b2eda98f9bba #v2.0.1
        id: coverage-md
        with:
          srcBasePath: './'
          textReportPath: './web-app/coverage/browser/coverage.txt'
      - run: echo "${MARKDOWN_REPORT}" >>$GITHUB_STEP_SUMMARY
        env:
          MARKDOWN_REPORT: '${{ steps.coverage-md.outputs.markdownReport }}'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-web-app
          path: ./web-app/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-web-app-browser
          path: ./web-app/coverage/browser/lcov.info
          if-no-files-found: error
          retention-days: 7
      - run: npm pack

  sonarscan:
    needs:
      - lib
      - web-app
      - platform-roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{ !cancelled()
      && needs.lib.result == 'success'
      && needs['web-app'].result == 'success' }}
    steps:
      - name: Scan must not be skipped on trunk commits, but won't run on forks
        if: >-
          ${{ github.event_name == 'push'
          && github.actor != 'dependabot[bot]'
          && !fromJSON(env.do_sonarscan) }}
        run: |
          echo "::error::SonarCloud scan skipped on a push to ${{ github.ref }}."
          echo "::error::Check the do_sonarscan expression at the top of this workflow."
          exit 1
      - name: Note the skip
        if: ${{ !fromJSON(env.do_sonarscan) }}
        run: echo "SonarCloud scan skipped (fork PR, dependabot, or merge queue)." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        if: fromJSON(env.do_sonarscan)
        with:
          # Full depth required for Sonar's blame and new-code dating.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        if: fromJSON(env.do_sonarscan)
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './lib/package-lock.json'
      - run: npm ci
        if: fromJSON(env.do_sonarscan)
        working-directory: ./lib
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-lib
          path: lib/coverage/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-web-app
          path: web-app/coverage/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-web-app-browser
          path: web-app/coverage/browser/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        if: fromJSON(env.do_sonarscan)
        continue-on-error: true
        with:
          name: coverage-roundtrip-browser
          path: web-app/coverage/roundtrip/
      - name: SonarCloud Scan
        if: fromJSON(env.do_sonarscan)
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f #v8.2.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/workflows
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: 🦇🦇🦇🦇🦇🦇
        run: docker run --rm -v "$PWD:/mnt" --workdir "/mnt" bats/bats:1.11.0 *.bats
      - name: 🦪 ✔ 🧼🧼🧼
        run: >-
          docker run --rm -v "$PWD:/mnt" --workdir "/mnt" "koalaman/shellcheck:v0.10.0"
          --color=always *.sh

  platform-roundtrip:
    needs:
      - cli
      - lib
      - web-app
    runs-on: ubuntu-22.04 # NOTE: Playwright not yet supported on 24.04
    defaults:
      run:
        working-directory: .github/workflows/roundtrip
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './web-app/package-lock.json'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-sdk-lib
          path: lib/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-ctl
          path: cli/
      - name: Git clone backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          path: .github/workflows/roundtrip/platform
          repository: opentdf/platform
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
        with:
          go-version-file: .github/workflows/roundtrip/platform/service/go.mod
          check-latest: false
          cache-dependency-path: |
            .github/workflows/roundtrip/platform/lib/fixtures/go.sum
            .github/workflows/roundtrip/platform/lib/ocrypto/go.sum
            .github/workflows/roundtrip/platform/protocol/go/go.sum
            .github/workflows/roundtrip/platform/sdk/go.sum
            .github/workflows/roundtrip/platform/service/go.sum
      - name: Allow Go toolchain auto-download
        # setup-go pins GOTOOLCHAIN=local; the platform's go.work may require a
        # newer Go toolchain than the version installed from service/go.mod.
        # Let Go fetch the required toolchain automatically so platform
        # provisioning (e.g. keycloak) doesn't fail on a version mismatch.
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - run: find ./ -name go.mod
      - name: verify platform go.work
        run: |-
          test -f ./platform/go.work
          cd ./platform/service
          go env GOWORK
      - run: docker compose up -d --wait --wait-timeout 240
      - env:
          PLAYWRIGHT_TESTS_TO_RUN: roundtrip
        run: |-
          ./wait-and-test.sh platform
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: ${{ always() && fromJSON(env.do_sonarscan) }}
        with:
          name: coverage-roundtrip-browser
          path: ./web-app/coverage/browser/lcov.info
          if-no-files-found: warn
          retention-days: 7

  platform-xtest:
    needs:
      - cli
      - lib
    uses: opentdf/tests/.github/workflows/xtest.yml@main
    with:
      focus-sdk: js
      # In the merge queue `github.ref` is refs/heads/gh-readonly-queue/main/pr-N-<sha>,
      # which xtest resolves down the plain-branch path and turns into a dist tag with
      # slashes still in it. Its SHA lookup has a merge-queue case that maps the same
      # commit to a flat `mq-main-N` tag, so hand it the head SHA instead of the ref.
      js-ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.ref }} main latest
      platform-ref: main lts

  ci:
    needs:
      - ccc
      - lib
      - cli
      - web-app
      - scripts
      - platform-roundtrip
      - platform-xtest
      - sonarscan
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() }}
    steps:
      # `build-and-test / ci` is a required status context and the only one that
      # summarizes this workflow, so it has to fail closed: anything that is not
      # `success` -- including `skipped` and `cancelled` -- must block. Asserting
      # over toJSON(needs) keeps every job in the `needs` list above covered
      # without a second list here to drift out of sync, and names the offending
      # job in the annotation.
      - name: "All jobs must have succeeded"
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(jq -r '[to_entries[]
            | select(.value.result != "success")
            | "\(.key)=\(.value.result)"] | join(" ")' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error::Jobs that did not succeed: $bad"
            exit 1
          fi
          echo "All jobs succeeded." >>"$GITHUB_STEP_SUMMARY"
