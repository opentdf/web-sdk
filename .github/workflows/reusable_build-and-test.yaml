name: "Reusable worflow: Build and Test Client"

env:
  do_sonarscan: >-
    ${{ (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]' }}

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  ccc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lib
    timeout-minutes: 5
    steps:
      - name: Conventional Commits Check
        if: contains(fromJSON('["pull_request", "pull_request_target"]'), github.event_name)
        id: conventional-commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Types include:
          #   - fix: fixes
          #   - feat: features and enhancements
          #   - chore: non-feature or enhancement (i.e. docs, ci, linting, automated, etc)
          types: |
            fix
            feat
            chore
            revert
          # Scopes include:
          #   - sdk: changes to @opentdf/sdk (was lib)
          #   - cli: changes to @opentdf/ctl
          #   - ci: anything related to ci
          #   - tests: test only changes
          #   - docs: anything related solely to documentation
          #   - main: release-please release PRs
          scopes: |
            ci
            cli
            docs
            main
            sdk
            tests

  lib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lib
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './lib/package-lock.json'
      - run: npm ci
      - run: npm test
      - uses: fingerprintjs/action-coverage-report-md@72dfb7de7581612640a8e599e918b2eda98f9bba #v2.0.1
        id: coverage-md
        with:
          srcBasePath: './'
          textReportPath: './lib/coverage/coverage.txt'
      - run: echo "${MARKDOWN_REPORT}" >>$GITHUB_STEP_SUMMARY
        env:
          MARKDOWN_REPORT: '${{ steps.coverage-md.outputs.markdownReport }}'
      - run: npm audit --omit dev && npm audit --audit-level high --omit dev
      - run: npm run license-check
      - run: npm run lint
      - run: npm pack
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: opentdf-sdk-lib
          path: ./lib/opentdf-sdk-*.tgz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-lib
          path: ./lib/coverage/lcov.info
          # Default is `warn`, which uploads nothing and still passes; the scan
          # job then fails on a missing artifact instead, pointing at the wrong
          # thing. Fail here, where the report was supposed to be produced.
          if-no-files-found: error
          retention-days: 7

  cli:
    needs:
      - lib
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './cli/package-lock.json'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-sdk-lib
          path: lib/
      - run: npm uninstall @opentdf/sdk && npm ci && npm i ../lib/opentdf-sdk-*.tgz
      - run: npm test
      - run: npm audit --omit dev && npm audit --audit-level high --omit dev
      - run: npm run license-check
      - run: npm run lint
      - run: npm pack
      - name: Setup Bats and bats libs
        uses: bats-core/bats-action@3.0.1
      - run: bats bin/opentdf.bats
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: opentdf-ctl
          path: ./cli/opentdf-ctl-*.tgz
          retention-days: 14

  web-app:
    needs:
      - lib
    runs-on: ubuntu-22.04 # NOTE: Playwright not yet supported on 24.04
    defaults:
      run:
        working-directory: ./web-app
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './web-app/package-lock.json'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-sdk-lib
          path: lib/
      - run: npm uninstall @opentdf/sdk && npm ci && npm i ../lib/opentdf-sdk-*.tgz
      - run: npm install
      - run: npm audit --omit dev && npm audit --audit-level high --omit dev
      - run: npm run license-check
      - run: npm run lint
      - run: npx playwright install
      - run: npm test
      # Unlike the Sonar decoration this also shows up on fork PRs, where
      # do_sonarscan is false and a reviewer otherwise gets no coverage signal.
      - uses: fingerprintjs/action-coverage-report-md@72dfb7de7581612640a8e599e918b2eda98f9bba #v2.0.1
        id: coverage-md
        with:
          srcBasePath: './'
          textReportPath: './web-app/coverage/browser/coverage.txt'
      - run: echo "${MARKDOWN_REPORT}" >>$GITHUB_STEP_SUMMARY
        env:
          MARKDOWN_REPORT: '${{ steps.coverage-md.outputs.markdownReport }}'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-web-app
          path: ./web-app/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      # The istanbul counters the instrumented bundle accumulated in the
      # browser. Unlike the v8 report above, this one covers lib/ as well.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-web-app-browser
          path: ./web-app/coverage/browser/lcov.info
          if-no-files-found: error
          retention-days: 7
      - run: npm pack

  # Split out from `lib` because sonar-project.properties covers web-app/src
  # too, and the web-app job that produces its coverage `needs: lib`. Steps are
  # guarded individually because a job-level `if` cannot read `env`. The
  # underlying expression uses only the `github` context, which *is* available
  # at job level, so inlining it there would work -- at the cost of repeating
  # it, and of losing the guard step below that catches an unintended skip.
  sonarscan:
    needs:
      - lib
      - web-app
      # For the roundtrip coverage only. A failed roundtrip must degrade how
      # complete the report is, not suppress the analysis -- hence the `if`
      # below, which waits for this job without requiring it, and the tolerated
      # download further down. lib and web-app are still required: without
      # their artifacts there is nothing worth scanning.
      - platform-roundtrip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{ !cancelled()
      && needs.lib.result == 'success'
      && needs['web-app'].result == 'success' }}
    steps:
      # do_sonarscan is meant to be false only on forks and dependabot, where
      # SONAR_TOKEN is unavailable. It reads github.event_name, so adding a
      # trigger to the calling workflow (merge_group, workflow_dispatch) makes
      # it false there too -- silently, with every job still green. The guard
      # lives here; the trigger list lives in build-and-test.yaml.
      - name: Scan must not be skipped on trunk
        if: >-
          ${{ github.event_name == 'push'
          && github.actor != 'dependabot[bot]'
          && !fromJSON(env.do_sonarscan) }}
        run: |
          echo "::error::SonarCloud scan skipped on a push to ${{ github.ref }}."
          echo "::error::Check the do_sonarscan expression at the top of this workflow."
          exit 1
      - name: Note the skip
        if: ${{ !fromJSON(env.do_sonarscan) }}
        run: echo "SonarCloud scan skipped (fork PR or dependabot)." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        if: fromJSON(env.do_sonarscan)
        with:
          # Sonar skips blame collection on a shallow clone, which breaks issue
          # author attribution and new-code dating, and it needs the target ref
          # present to diff a pull request against it.
          fetch-depth: 0
      # SonarJS builds a TypeScript program to run its type-aware rules. Without
      # node_modules every external import resolves to `any` and those rules go
      # quiet -- no failure, just fewer issues found. The scan used to run as a
      # step of `lib`, after its `npm ci`; this restores that. web-app is not
      # installed here because its `npm ci` wants the packed SDK tarball, so its
      # analysis is no more type-aware than it was before the split.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
        if: fromJSON(env.do_sonarscan)
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './lib/package-lock.json'
      - run: npm ci
        if: fromJSON(env.do_sonarscan)
        working-directory: ./lib
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-lib
          path: lib/coverage/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-web-app
          path: web-app/coverage/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        if: fromJSON(env.do_sonarscan)
        with:
          name: coverage-web-app-browser
          path: web-app/coverage/browser/
      # Same producer as coverage-web-app-browser, so it needs its own
      # directory. Tolerated rather than required: if platform-roundtrip failed
      # there is no artifact, and scanning without it beats not scanning.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        if: fromJSON(env.do_sonarscan)
        continue-on-error: true
        with:
          name: coverage-roundtrip-browser
          path: web-app/coverage/roundtrip/
      - name: SonarCloud Scan
        if: fromJSON(env.do_sonarscan)
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 #v5.3.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/workflows
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: 🦇🦇🦇🦇🦇🦇
        run: docker run --rm -v "$PWD:/mnt" --workdir "/mnt" bats/bats:1.11.0 *.bats
      - name: 🦪 ✔ 🧼🧼🧼
        run: >-
          docker run --rm -v "$PWD:/mnt" --workdir "/mnt" "koalaman/shellcheck:v0.10.0"
          --color=always *.sh

  platform-roundtrip:
    needs:
      - cli
      - lib
      - web-app
    runs-on: ubuntu-22.04 # NOTE: Playwright not yet supported on 24.04
    defaults:
      run:
        working-directory: .github/workflows/roundtrip
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 #v5.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './web-app/package-lock.json'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-sdk-lib
          path: lib/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-ctl
          path: cli/
      - name: Git clone backend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          path: .github/workflows/roundtrip/platform
          repository: opentdf/platform
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
        with:
          go-version-file: .github/workflows/roundtrip/platform/service/go.mod
          check-latest: false
          cache-dependency-path: |
            .github/workflows/roundtrip/platform/lib/fixtures/go.sum
            .github/workflows/roundtrip/platform/lib/ocrypto/go.sum
            .github/workflows/roundtrip/platform/protocol/go/go.sum
            .github/workflows/roundtrip/platform/sdk/go.sum
            .github/workflows/roundtrip/platform/service/go.sum
      - name: Allow Go toolchain auto-download
        # setup-go pins GOTOOLCHAIN=local; the platform's go.work may require a
        # newer Go toolchain than the version installed from service/go.mod.
        # Let Go fetch the required toolchain automatically so platform
        # provisioning (e.g. keycloak) doesn't fail on a version mismatch.
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - run: find ./ -name go.mod
      - name: verify platform go.work
        run: |-
          test -f ./platform/go.work
          cd ./platform/service
          go env GOWORK
      - run: docker compose up -d --wait --wait-timeout 240
      - env:
          PLAYWRIGHT_TESTS_TO_RUN: roundtrip
        run: |-
          ./wait-and-test.sh platform
      # The SDK exercised against a live KAS in three real browsers -- the only
      # coverage of lib/ that runs the way a consumer runs it. Uploaded even on
      # failure: a suite that got most of the way through still measured most
      # of the way through, and sonarscan tolerates the artifact being absent.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        if: ${{ always() && fromJSON(env.do_sonarscan) }}
        with:
          name: coverage-roundtrip-browser
          path: ./web-app/coverage/browser/lcov.info
          if-no-files-found: warn
          retention-days: 7

  platform-xtest:
    needs:
      - cli
      - lib
    uses: opentdf/tests/.github/workflows/xtest.yml@main
    with:
      focus-sdk: js
      js-ref: ${{ github.ref }} main latest
      platform-ref: main lts

  ci:
    needs:
      - lib
      - cli
      - web-app
      - scripts
      - platform-xtest
      # Kept here so a failed scan still fails CI, as it did when the scan was
      # a step of `lib`. On a fork every step in the job is skipped but the job
      # itself still concludes `success`, so this does not turn forks red.
      - sonarscan
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() }}
    steps:

      - name: "All jobs succeeded"
        id: success
        if: ${{ contains(needs.*.result, 'success') }}
        run: |
          :

      - name: "One or more jobs failed"
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          exit 1
