name: "Build and Test Client"

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

permissions: {}

jobs:
  build-and-test:
    #   packages: read       -- ghcr pulls in xtest's start-up-with-containers
    #   pull-requests: write -- xtest's publish-results comments on the PR; ccc
    #                           and the Sonar scan read PR context
    # Narrowing further means per-job blocks inside
    # reusable_build-and-test.yaml, which the `@main` pin makes untestable from
    # a PR -- tracked separately.
    permissions:
      contents: read
      packages: read # For using published artifacts, e.g. in `start-up-with-containers`    
      pull-requests: write # For comments on PR from ccc check, xtest, and others
    uses: opentdf/web-sdk/.github/workflows/reusable_build-and-test.yaml@main
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
