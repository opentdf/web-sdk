name: Build, Test, and Deliver Client

on:
  schedule:
    - cron: '0 4 * * 2,4'
  workflow_dispatch:
jobs:
  lib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lib
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './lib/package-lock.json'
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: coverage
          path: lib/coverage/
      - run: npm audit --omit dev --audit-level moderate
      - run: npm run license-check
      - run: npm run lint
      - run: npm pack
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: opentdf-sdk-lib
          path: ./lib/opentdf-sdk-*.tgz

  cli:
    needs:
      - lib
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cli
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './cli/package-lock.json'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-sdk-lib
          path: lib/
      - run: npm uninstall @opentdf/sdk && npm ci && npm i ../lib/opentdf-sdk-*.tgz
      - run: npm test
      - run: npm audit --omit dev --audit-level moderate
      - run: npm run license-check
      - run: npm run lint
      - run: npm pack
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: opentdf-ctl
          path: ./cli/opentdf-ctl-*.tgz

  web-app:
    needs:
      - lib
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-app
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './web-app/package-lock.json'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-sdk-lib
          path: lib/
      - run: npm uninstall @opentdf/sdk && npm ci && npm i ../lib/opentdf-sdk-*.tgz
      - run: npm install
      - run: npx playwright install
      - run: npm test
      - run: npm audit --omit dev --audit-level moderate
      - run: npm run license-check
      - run: npm run lint
      - run: npm pack

  large-file-roundtrip:
    needs:
      - cli
      - lib
    runs-on: ubuntu-22.04 # NOTE: Playwright not yet supported on 24.04
    defaults:
      run:
        working-directory: .github/workflows/roundtrip
    timeout-minutes: 120
    steps:
      - name: Free disk space
        # The largest case keeps ~5 GiB of ciphertext and ~5 GiB of plaintext
        # on disk at once, more than the runner leaves free by default.
        working-directory: /
        run: |-
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './web-app/package-lock.json'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-sdk-lib
          path: lib/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: opentdf-ctl
          path: cli/
      - name: Git clone backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          path: .github/workflows/roundtrip/platform
          repository: opentdf/platform
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c #v6.4.0
        with:
          go-version-file: .github/workflows/roundtrip/platform/service/go.mod
          check-latest: false
          cache-dependency-path: |
            .github/workflows/roundtrip/platform/lib/fixtures/go.sum
            .github/workflows/roundtrip/platform/lib/ocrypto/go.sum
            .github/workflows/roundtrip/platform/protocol/go/go.sum
            .github/workflows/roundtrip/platform/sdk/go.sum
            .github/workflows/roundtrip/platform/service/go.sum
      - name: Allow Go toolchain auto-download
        # See the matching step in reusable_build-and-test.yaml.
        run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - run: docker compose up -d --wait --wait-timeout 240
      - env:
          PLAYWRIGHT_TESTS_TO_RUN: huge
        run: |-
          ./wait-and-test.sh platform
