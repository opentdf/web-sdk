services:
  keycloak:
    image: keycloak/keycloak:26.8.0
    restart: always
    command:
    - "start-dev"
    - "--verbose"
    environment:
      KC_FEATURES: "preview,token-exchange"
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: 'http://localhost:65432/auth'
      KC_HOSTNAME_ADMIN: 'http://localhost:65432/auth'
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '8888'
      KC_HTTP_RELATIVE_PATH: '/auth'
      KC_PROXY_HEADERS: 'xforwarded'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changeme
    ports:
      - '8888:8888'
    healthcheck:
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/auth/health/ready']
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 2m
  opentdfdb:
    image: postgres:15-alpine
    restart: always
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: opentdf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
