# must be unique in a given SonarQube instance
sonar.projectKey=opentdf_client-web

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
# This property is optional if sonar.modules is set.
sonar.sources=lib/src,lib/tdf3,web-app/src,web-app/public
sonar.exclusions=lib/src/platform/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Excluding the test files above only stops them counting as main source. Naming
# them here as well keeps them analyzed, under test-specific rules. sonar.tests
# and sonar.sources must not overlap, which is what the exclusions above ensure.
sonar.tests=lib/tests,web-app/src,web-app/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.host.url=https://sonarcloud.io
sonar.organization=opentdf

# Code coverage. All four are downloaded as artifacts by the sonarscan job,
# since the jobs that generate them run separately. Sonar unions them, so a
# line covered by any one of them counts as covered.
#
#   lib/coverage             lib's node + web-test-runner suites, merged by nyc.
#   web-app/coverage         vitest's v8 provider. Near-zero by construction:
#                            it instruments the test's Node process, and every
#                            test in web-app drives a browser instead. Kept for
#                            future in-process unit tests.
#   web-app/coverage/browser
#   web-app/coverage/roundtrip
#                            the ones that matter for lib/. Under COVERAGE=1,
#                            web-app builds against lib TypeScript source with
#                            vite-plugin-istanbul, so the SDK is measured as it
#                            actually runs in a browser -- bundled, same-origin,
#                            real WebCrypto, against a live KAS. Same producer,
#                            two jobs (web-app and platform-roundtrip), hence
#                            two directories. SF paths are repo-root relative;
#                            see the `--cwd ..` in the coverage:browser script.
sonar.javascript.lcov.reportPaths=lib/coverage/lcov.info,web-app/coverage/lcov.info,web-app/coverage/browser/lcov.info,web-app/coverage/roundtrip/lcov.info

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Ignore generated files during analysis
# Also, ignore healthz file since it is itself a test, and does not need testing.
# sonar.exclusions=public/js/*.js,public/css/*.css,lib/app/routes/healthz.js